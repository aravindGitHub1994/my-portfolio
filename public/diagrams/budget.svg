<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 492" width="440" height="492" role="img" aria-labelledby="bud-title" data-diagram="budget" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="bud-title">Budget Optimizer pipeline: ingest and clean multi-market history, align a geo-time panel in Xarray, fit the Meridian Bayesian MMM with MCMC sampling and ROI priors, run the budget optimizer, and export the report.</title>

  <g class="dg-edges">
    <path class="dg-edge" id="bud-e1" data-from="raw" data-to="panel" data-step="1" d="M220,84 L220,107" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M215,104 L225,104 L220,113 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e2" data-from="panel" data-to="model" data-step="3" d="M220,180 L220,203" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M215,200 L225,200 L220,209 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e3" data-from="model" data-to="opt" data-step="5" d="M220,276 L220,299" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M215,296 L225,296 L220,305 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e4" data-from="opt" data-to="report" data-step="7" d="M220,372 L220,395" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="7" d="M215,392 L225,392 L220,401 Z" fill="rgba(162,168,180,0.65)"/>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="bud-n-raw" data-node="raw" data-step="0">
      <rect x="60" y="20" width="320" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="220" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#f2f4f8">Ingest &amp; clean</text>
      <text x="220" y="70" text-anchor="middle" font-size="13.5" fill="#a2a8b4">multi-market history</text>
    </g>

    <g class="dg-node" id="bud-n-panel" data-node="panel" data-step="2">
      <rect x="60" y="116" width="320" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="220" y="144" text-anchor="middle" font-size="17" font-weight="600" fill="#f2f4f8">Xarray panel</text>
      <text x="220" y="166" text-anchor="middle" font-size="13.5" fill="#a2a8b4">geo × time alignment</text>
    </g>

    <g class="dg-node" id="bud-n-model" data-node="model" data-key="true" data-step="4">
      <rect x="60" y="212" width="320" height="64" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="2"/>
      <text x="220" y="240" text-anchor="middle" font-size="17" font-weight="600" fill="#f2f4f8">Meridian MMM</text>
      <text x="220" y="262" text-anchor="middle" font-size="13.5" fill="#a2a8b4">MCMC · ROI priors</text>
    </g>

    <g class="dg-node" id="bud-n-opt" data-node="opt" data-step="6">
      <rect x="60" y="308" width="320" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="220" y="336" text-anchor="middle" font-size="17" font-weight="600" fill="#f2f4f8">Optimizer</text>
      <text x="220" y="358" text-anchor="middle" font-size="13.5" fill="#a2a8b4">fixed &amp; flex budgets</text>
    </g>

    <g class="dg-node" id="bud-n-report" data-node="report" data-step="8">
      <rect x="60" y="404" width="320" height="64" rx="10" fill="#0e0e14" stroke="#8fb3ff" stroke-opacity="0.75" stroke-width="2"/>
      <text x="220" y="432" text-anchor="middle" font-size="17" font-weight="600" fill="#f2f4f8">Report</text>
      <text x="220" y="454" text-anchor="middle" font-size="13.5" fill="#a2a8b4">curves · reallocation</text>
    </g>
  </g>
</svg>
