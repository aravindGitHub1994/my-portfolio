<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 196" width="780" height="196" role="img" aria-labelledby="bud-title" data-diagram="budget" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="bud-title">Budget Optimizer pipeline: ingest and clean multi-market history, align a geo-time panel in Xarray, fit the Meridian Bayesian MMM with MCMC sampling and ROI priors, run the budget optimizer, and export the report.</title>

  <g class="dg-edges">
    <path class="dg-edge" id="bud-e1" data-from="raw" data-to="panel" data-step="1" d="M138,98 L160,98" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M157,93 L157,103 L166,98 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e2" data-from="panel" data-to="model" data-step="3" d="M294,98 L316,98" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M313,93 L313,103 L322,98 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e3" data-from="model" data-to="opt" data-step="5" d="M450,98 L472,98" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M469,93 L469,103 L478,98 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="bud-e4" data-from="opt" data-to="report" data-step="7" d="M606,98 L628,98" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="7" d="M625,93 L625,103 L634,98 Z" fill="rgba(162,168,180,0.65)"/>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="bud-n-raw" data-node="raw" data-step="0">
      <rect x="10" y="60" width="128" height="76" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5"/>
      <text x="74" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4f8">Ingest &amp; clean</text>
      <text x="74" y="112" text-anchor="middle" font-size="10" fill="#a2a8b4">multi-market history</text>
    </g>

    <g class="dg-node" id="bud-n-panel" data-node="panel" data-step="2">
      <rect x="166" y="60" width="128" height="76" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5"/>
      <text x="230" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4f8">Xarray panel</text>
      <text x="230" y="112" text-anchor="middle" font-size="10" fill="#a2a8b4">geo × time alignment</text>
    </g>

    <g class="dg-node" id="bud-n-model" data-node="model" data-key="true" data-step="4">
      <rect x="322" y="60" width="128" height="76" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="1.5"/>
      <text x="386" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4f8">Meridian MMM</text>
      <text x="386" y="112" text-anchor="middle" font-size="10" fill="#a2a8b4">MCMC · ROI priors</text>
    </g>

    <g class="dg-node" id="bud-n-opt" data-node="opt" data-step="6">
      <rect x="478" y="60" width="128" height="76" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5"/>
      <text x="542" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4f8">Optimizer</text>
      <text x="542" y="112" text-anchor="middle" font-size="10" fill="#a2a8b4">fixed &amp; flex budgets</text>
    </g>

    <g class="dg-node" id="bud-n-report" data-node="report" data-step="8">
      <rect x="634" y="60" width="128" height="76" rx="10" fill="#0e0e14" stroke="#8fb3ff" stroke-opacity="0.75" stroke-width="1.5"/>
      <text x="698" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4f8">Report</text>
      <text x="698" y="112" text-anchor="middle" font-size="10" fill="#a2a8b4">curves · reallocation</text>
    </g>
  </g>
</svg>
