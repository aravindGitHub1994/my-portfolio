<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="tag-title" data-diagram="tagging" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="tag-title">Tagging and measurement lifecycle: audit an existing site's tags and dataLayer, author a multi-platform tag plan, implement it with dataLayer and Google Tag Manager — including a server-side GTM container for first-party durability — QA in preview, publish a versioned container out to nine-plus ad and analytics platforms, then govern it — monitoring and troubleshooting continuously, which feeds the next audit.</title>

  <g class="dg-edges">
    <!-- Audit → Tag Plan -->
    <path class="dg-edge" id="tag-e1" data-from="audit" data-to="plan" data-step="1" d="M296,104 L363,104" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M364,95 L374,95 L369,104 Z" transform="rotate(-90, 369, 104)" fill="rgba(162,168,180,0.65)"/>

    <!-- Tag Plan → Implement -->
    <path class="dg-edge" id="tag-e2" data-from="plan" data-to="impl" data-step="3" d="M576,104 L643,104" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M644,95 L654,95 L649,104 Z" transform="rotate(-90, 649, 104)" fill="rgba(162,168,180,0.65)"/>

    <!-- Implement → Server GTM (the server-side container hangs off the
         client implementation; ADR-010 §5) -->
    <path class="dg-edge" id="tag-e8" data-from="impl" data-to="sgtm" data-step="5" d="M676,144 L676,167" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M671,164 L681,164 L676,173 Z" fill="rgba(162,168,180,0.65)"/>

    <!-- Implement → QA (down the right side) -->
    <path class="dg-edge" id="tag-e3" data-from="impl" data-to="qa" data-step="7" d="M756,144 L756,235" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="7" d="M751,232 L761,232 L756,241 Z" fill="rgba(162,168,180,0.65)"/>

    <!-- QA → Publish (return leg, right→left) -->
    <path class="dg-edge" id="tag-e4" data-from="qa" data-to="publish" data-step="9" d="M656,284 L589,284" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="9" d="M578,275 L588,275 L583,284 Z" transform="rotate(90, 583, 284)" fill="rgba(162,168,180,0.65)"/>

    <!-- Publish → platform rail -->
    <path class="dg-edge" id="tag-e6" data-from="publish" data-to="platforms" data-step="11" d="M476,324 L476,407" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="11" d="M471,404 L481,404 L476,413 Z" fill="rgba(162,168,180,0.65)"/>

    <!-- Publish → Govern (return leg continues left) -->
    <path class="dg-edge" id="tag-e5" data-from="publish" data-to="govern" data-step="13" d="M376,284 L309,284" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="13" d="M298,275 L308,275 L303,284 Z" transform="rotate(90, 303, 284)" fill="rgba(162,168,180,0.65)"/>

    <!-- Govern → Audit: the loop-back. Governance never ends; it re-opens the audit. -->
    <path class="dg-edge" id="tag-e7" data-from="govern" data-to="audit" data-step="15" d="M96,284 C30,284 30,104 90,104" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="15" d="M91,95 L101,95 L96,104 Z" transform="rotate(-90, 96, 104)" fill="rgba(162,168,180,0.65)"/>
    <text class="dg-label" data-step="15" transform="rotate(-90, 70, 194)" x="70" y="194" text-anchor="middle" font-size="14" fill="#6a7080">continuous</text>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="tag-n-audit" data-node="audit" data-step="0">
      <rect x="96" y="64" width="200" height="80" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="196" y="98" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Audit</text>
      <text x="196" y="122" text-anchor="middle" font-size="13" fill="#a2a8b4">tags · dataLayer · gaps</text>
    </g>

    <g class="dg-node" id="tag-n-plan" data-node="plan" data-key="true" data-step="2">
      <rect x="376" y="64" width="200" height="80" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="2"/>
      <text x="476" y="98" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Tag Plan</text>
      <text x="476" y="122" text-anchor="middle" font-size="13" fill="#a2a8b4">multi-platform spec</text>
    </g>

    <g class="dg-node" id="tag-n-impl" data-node="impl" data-step="4">
      <rect x="656" y="64" width="200" height="80" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="756" y="98" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Implement</text>
      <text x="756" y="122" text-anchor="middle" font-size="13" fill="#a2a8b4">dataLayer + GTM · vanilla JS</text>
    </g>

    <g class="dg-node" id="tag-n-sgtm" data-node="sgtm" data-step="6">
      <rect x="496" y="174" width="200" height="60" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="596" y="199" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Server GTM</text>
      <text x="596" y="221" text-anchor="middle" font-size="13" fill="#a2a8b4">server-side container · 1st-party</text>
    </g>

    <g class="dg-node" id="tag-n-qa" data-node="qa" data-step="8">
      <rect x="656" y="244" width="200" height="80" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="756" y="278" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">QA</text>
      <text x="756" y="302" text-anchor="middle" font-size="13" fill="#a2a8b4">preview · debug · validate</text>
    </g>

    <g class="dg-node" id="tag-n-publish" data-node="publish" data-step="10">
      <rect x="376" y="244" width="200" height="80" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="476" y="278" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Publish</text>
      <text x="476" y="302" text-anchor="middle" font-size="13" fill="#a2a8b4">versioned container</text>
    </g>

    <g class="dg-node" id="tag-n-govern" data-node="govern" data-key="true" data-step="14">
      <rect x="96" y="244" width="200" height="80" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="2"/>
      <text x="196" y="278" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Govern</text>
      <text x="196" y="302" text-anchor="middle" font-size="13" fill="#a2a8b4">monitor · troubleshoot</text>
    </g>

    <g class="dg-node dg-container" id="tag-n-rail" data-node="platforms" data-step="12">
      <rect x="96" y="416" width="760" height="112" rx="12" fill="rgba(13,13,18,0.55)" stroke="#8fb3ff" stroke-opacity="0.75" stroke-width="2"/>
      <text x="476" y="450" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">9+ ad &amp; analytics platforms</text>
      <text x="476" y="480" text-anchor="middle" font-size="13" fill="#a2a8b4">GA4 · Meta · Google Ads · CM360 · DV360</text>
      <text x="476" y="504" text-anchor="middle" font-size="13" fill="#a2a8b4">Criteo · Kakao · StackAdapt · The Trade Desk</text>
    </g>
  </g>
</svg>
