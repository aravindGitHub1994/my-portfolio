<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="per-title" data-diagram="personas" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="per-title">Personas pipeline (exploratory): select segments from the synthetic Nemotron persona dataset by OCEAN and demographic traits, simulate persona responses with an LLM, and branch into marketing messaging tests and QA bias and localization checks — no real PII at any stage.</title>

  <g class="dg-edges">
    <path class="dg-edge" id="per-e1" data-from="data" data-to="select" data-step="1" d="M280,84 L280,137" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M275,137 L285,137 L280,146 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="per-e2" data-from="select" data-to="sim" data-step="3" d="M280,214 L280,267" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M275,267 L285,267 L280,276 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="per-e3" data-from="sim" data-to="mkt" data-step="5" d="M280,344 L154,394" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M141,388 L151,388 L146,397 Z" fill="rgba(162,168,180,0.65)" transform="rotate(68,146,397)"/>

    <path class="dg-edge" id="per-e4" data-from="sim" data-to="qa" data-step="5" d="M280,344 L406,394" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M409,388 L419,388 L414,397 Z" fill="rgba(162,168,180,0.65)" transform="rotate(-68,414,397)"/>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="per-n-data" data-node="data" data-step="0">
      <rect x="140" y="20" width="280" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.5)" stroke-width="2"/>
      <path d="M140,32 A140,10 0 0 0 420,32" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1"/>
      <text x="280" y="55" text-anchor="middle" font-size="16" font-weight="600" fill="#f2f4f8">Nemotron persona dataset</text>
      <text x="280" y="75" text-anchor="middle" font-size="12.5" fill="#a2a8b4">synthetic · privacy-safe</text>
    </g>

    <g class="dg-node" id="per-n-select" data-node="select" data-step="2">
      <rect x="140" y="150" width="280" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="280" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#f2f4f8">Segment / OCEAN selection</text>
      <text x="280" y="202" text-anchor="middle" font-size="12.5" fill="#a2a8b4">traits · geo · socio-professional</text>
    </g>

    <g class="dg-node" id="per-n-sim" data-node="sim" data-key="true" data-step="4">
      <rect x="140" y="280" width="280" height="64" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="280" y="308" text-anchor="middle" font-size="16" font-weight="600" fill="#f2f4f8">LLM persona simulation</text>
      <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#a2a8b4">exploratory · no real PII</text>
    </g>

    <g class="dg-node" id="per-n-mkt" data-node="mkt" data-step="6">
      <rect x="14" y="400" width="256" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="142" y="428" text-anchor="middle" font-size="16" font-weight="600" fill="#f2f4f8">Marketing use cases</text>
      <text x="142" y="452" text-anchor="middle" font-size="12.5" fill="#a2a8b4">messaging &amp; segmentation tests</text>
    </g>

    <g class="dg-node" id="per-n-qa" data-node="qa" data-step="6">
      <rect x="290" y="400" width="256" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="418" y="428" text-anchor="middle" font-size="16" font-weight="600" fill="#f2f4f8">QA use cases</text>
      <text x="418" y="452" text-anchor="middle" font-size="12.5" fill="#a2a8b4">bias &amp; localization checks</text>
    </g>
  </g>
</svg>
