<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="per-title" data-diagram="personas" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="per-title">Personas pipeline (exploratory): select segments from the synthetic Nemotron persona dataset by OCEAN and demographic traits, simulate persona responses with an LLM, and branch into marketing messaging tests and QA bias and localization checks — no real PII at any stage.</title>

  <g class="dg-edges">
    <path class="dg-edge" id="per-e1" data-from="data" data-to="select" data-step="1" d="M280,82 L280,134" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M275,131 L285,131 L280,140 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="per-e2" data-from="select" data-to="sim" data-step="3" d="M280,198 L280,250" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M275,247 L285,247 L280,256 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="per-e3" data-from="sim" data-to="mkt" data-step="5" d="M220,314 C185,334 162,346 150,368" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M141,367 L151,367 L146,376 Z" fill="rgba(162,168,180,0.65)" transform="rotate(29,146,376)"/>

    <path class="dg-edge" id="per-e4" data-from="sim" data-to="qa" data-step="5" d="M340,314 C375,334 398,346 410,368" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M409,367 L419,367 L414,376 Z" fill="rgba(162,168,180,0.65)" transform="rotate(-29,414,376)"/>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="per-n-data" data-node="data" data-step="0">
      <rect x="160" y="24" width="240" height="58" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.5)" stroke-width="1.5"/>
      <path d="M160,36 A120,10 0 0 0 400,36" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1"/>
      <text x="280" y="56" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f2f4f8">Nemotron persona dataset</text>
      <text x="280" y="71" text-anchor="middle" font-size="10.5" fill="#a2a8b4">synthetic · privacy-safe</text>
    </g>

    <g class="dg-node" id="per-n-select" data-node="select" data-step="2">
      <rect x="160" y="140" width="240" height="58" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5"/>
      <text x="280" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f2f4f8">Segment / OCEAN selection</text>
      <text x="280" y="183" text-anchor="middle" font-size="10.5" fill="#a2a8b4">traits · geo · socio-professional</text>
    </g>

    <g class="dg-node" id="per-n-sim" data-node="sim" data-key="true" data-step="4">
      <rect x="160" y="256" width="240" height="58" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="280" y="281" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f2f4f8">LLM persona simulation</text>
      <text x="280" y="299" text-anchor="middle" font-size="10.5" fill="#a2a8b4">exploratory · no real PII</text>
    </g>

    <g class="dg-node" id="per-n-mkt" data-node="mkt" data-step="6">
      <rect x="40" y="380" width="220" height="58" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="150" y="405" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f2f4f8">Marketing use cases</text>
      <text x="150" y="423" text-anchor="middle" font-size="10.5" fill="#a2a8b4">messaging &amp; segmentation tests</text>
    </g>

    <g class="dg-node" id="per-n-qa" data-node="qa" data-step="6">
      <rect x="300" y="380" width="220" height="58" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="410" y="405" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f2f4f8">QA use cases</text>
      <text x="410" y="423" text-anchor="middle" font-size="10.5" fill="#a2a8b4">bias &amp; localization checks</text>
    </g>
  </g>
</svg>
