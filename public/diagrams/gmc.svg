<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" role="img" aria-labelledby="gmc-title" data-diagram="gmc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="gmc-title">GMC Insights pipeline: a service account authenticated as admin on the parent MCA discovers 44 Merchant Center sub-accounts, aggregates product disapproval statuses, caches results in SQLite, and serves them through a FastAPI backend to a filterable React table.</title>

  <g class="dg-edges">
    <path class="dg-edge" id="gmc-e1" data-from="sa" data-to="subs" data-step="1" d="M210,84 L210,107" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="1" d="M205,104 L215,104 L210,113 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="gmc-e2" data-from="subs" data-to="agg" data-step="3" d="M210,180 L210,203" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="3" d="M205,200 L215,200 L210,209 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="gmc-e3" data-from="agg" data-to="cache" data-step="5" d="M210,276 L210,299" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="5" d="M205,296 L215,296 L210,305 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="gmc-e4" data-from="cache" data-to="api" data-step="7" d="M210,372 L210,395" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="7" d="M205,392 L215,392 L210,401 Z" fill="rgba(162,168,180,0.65)"/>

    <path class="dg-edge" id="gmc-e5" data-from="api" data-to="table" data-step="9" d="M210,468 L210,491" pathLength="1" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path class="dg-arrow" data-step="9" d="M205,488 L215,488 L210,497 Z" fill="rgba(162,168,180,0.65)"/>
  </g>

  <g class="dg-nodes">
    <g class="dg-node" id="gmc-n-sa" data-node="sa" data-step="0">
      <rect x="60" y="20" width="300" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="210" y="48" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">Service account</text>
      <text x="210" y="70" text-anchor="middle" font-size="13" fill="#a2a8b4">admin on parent MCA</text>
    </g>

    <g class="dg-node" id="gmc-n-subs" data-node="subs" data-key="true" data-step="2">
      <rect x="60" y="116" width="300" height="64" rx="10" fill="#0e0e14" stroke="#3d74ff" stroke-opacity="0.8" stroke-width="2"/>
      <text x="210" y="144" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">44 GMC sub-accounts</text>
      <text x="210" y="166" text-anchor="middle" font-size="13" fill="#a2a8b4">discovered via Merchant API</text>
    </g>

    <g class="dg-node" id="gmc-n-agg" data-node="agg" data-step="4">
      <rect x="60" y="212" width="300" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="210" y="240" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">aggregateProductStatuses</text>
      <text x="210" y="262" text-anchor="middle" font-size="13" fill="#a2a8b4">disapproval data · on demand</text>
    </g>

    <g class="dg-node" id="gmc-n-cache" data-node="cache" data-step="6">
      <rect x="60" y="308" width="300" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.5)" stroke-width="2"/>
      <path d="M60,320 A150,10 0 0 0 360,320" fill="none" stroke="rgba(162,168,180,0.5)" stroke-width="1"/>
      <text x="210" y="343" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">SQLite cache</text>
      <text x="210" y="363" text-anchor="middle" font-size="13" fill="#a2a8b4">stays inside API quota</text>
    </g>

    <g class="dg-node" id="gmc-n-api" data-node="api" data-step="8">
      <rect x="60" y="404" width="300" height="64" rx="10" fill="#0e0e14" stroke="rgba(162,168,180,0.35)" stroke-width="2"/>
      <text x="210" y="432" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">FastAPI backend</text>
      <text x="210" y="454" text-anchor="middle" font-size="13" fill="#a2a8b4">serves cached aggregates</text>
    </g>

    <g class="dg-node" id="gmc-n-table" data-node="table" data-step="10">
      <rect x="60" y="500" width="300" height="64" rx="10" fill="#0e0e14" stroke="#8fb3ff" stroke-opacity="0.75" stroke-width="2"/>
      <text x="210" y="528" text-anchor="middle" font-size="16.5" font-weight="600" fill="#f2f4f8">React disapprovals table</text>
      <text x="210" y="550" text-anchor="middle" font-size="13" fill="#a2a8b4">filters + search</text>
    </g>
  </g>
</svg>
